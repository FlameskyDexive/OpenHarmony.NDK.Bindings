name: OpenHarmony API13-26 bindings

on:
  push:
    branches: [main, openharmony/api26-bindings]
    tags:
      - 'v*-ohos.*-preview.*'
      - 'v*-ohos.*-rc.*'
  pull_request:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Bindings verification tier
        required: true
        type: choice
        default: pr
        options: [pr, nightly, release]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  INSTALLED_NATIVE_APIS: '13,14,15,18,20,23,26'

jobs:
  managed:
    name: Managed generator and binding tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore tools and test the solution
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet test OpenHarmony.NDK.Bindings.sln --configuration Release --verbosity minimal
      - name: Verify source integrity
        shell: pwsh
        run: |
          git diff --check
          if ((git status --porcelain)) { throw 'Tests changed tracked files.' }

  pr-api-edges:
    name: PR API13/API26 ABI probes
    needs: managed
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr')
    runs-on: [self-hosted, Windows, harmonyos-sdk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify checked-in API13/API26 SDK inventories
        shell: pwsh
        run: |
          $sdkRoot = if ($env:OPENHARMONY_SDK_ROOT) { $env:OPENHARMONY_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'OpenHarmony\Sdk' }
          dotnet run --project tools/BindingGenerator --configuration Release -- verify-sdk --sdk-root $sdkRoot --apis 13,26
      - name: Compile API13/API26 for both ABIs
        shell: pwsh
        run: |
          $sdkRoot = if ($env:OPENHARMONY_SDK_ROOT) { $env:OPENHARMONY_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'OpenHarmony\Sdk' }
          ./tools/run-abi-matrix.ps1 -SdkRoot $sdkRoot -Apis 13,26 -Abis arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: pr-api13-api26-abi-probes
          path: artifacts/abi-matrix/*.o
          if-no-files-found: error

  nightly-abi:
    name: Nightly API13-24/26 ABI matrix
    needs: managed
    if: >-
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["nightly","release"]'), inputs.tier))
    runs-on: [self-hosted, Windows, harmonyos-sdk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify all installed SDK inventories
        shell: pwsh
        run: |
          $sdkRoot = if ($env:OPENHARMONY_SDK_ROOT) { $env:OPENHARMONY_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'OpenHarmony\Sdk' }
          dotnet run --project tools/BindingGenerator --configuration Release -- verify-sdk --sdk-root $sdkRoot --apis $env:INSTALLED_NATIVE_APIS
      - name: Compile the logical 13-24/26 matrix
        shell: pwsh
        run: |
          $sdkRoot = if ($env:OPENHARMONY_SDK_ROOT) { $env:OPENHARMONY_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'OpenHarmony\Sdk' }
          ./tools/run-abi-matrix.ps1 -SdkRoot $sdkRoot -Apis (13..24 + 26) -Abis arm64-v8a,x86_64
          $objects = @(Get-ChildItem artifacts/abi-matrix -Filter '*.o')
          if ($objects.Count -ne 14) { throw "Expected 14 installed-SDK ABI objects, found $($objects.Count)." }
          if (@($objects | Where-Object Name -Match 'api25').Count) { throw 'API25 probe must never exist.' }
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-api13-api26-bindings
          path: artifacts/abi-matrix/*.o
          if-no-files-found: error

  release-abi:
    name: Preview/RC ABI artifact gate
    needs: nightly-abi
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'release')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-api13-api26-bindings
          path: artifacts/abi-matrix
      - name: Require the immutable 14-object installed-SDK set
        shell: pwsh
        run: |
          $objects = @(Get-ChildItem artifacts/abi-matrix -Filter '*.o')
          if ($objects.Count -ne 14) { throw "Expected 14 ABI probe objects, found $($objects.Count)." }
          foreach ($object in $objects) {
            if ((Get-FileHash $object.FullName -Algorithm SHA256).Hash -notmatch '^[0-9A-F]{64}$') { throw "Unable to hash $($object.Name)." }
          }
